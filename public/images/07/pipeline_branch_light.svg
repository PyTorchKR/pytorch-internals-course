<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#C0392B"/></marker></defs>
<text x="20" y="46" font-size="14" font-weight="600" fill="#2C2C2A">Branch latency: 분기 방향과 target 주소는 EX가 끝나야 정해진다</text>
<text x="281.0" y="72" text-anchor="middle" fill="#5F5E5A" font-size="11">cycle 1</text>
<text x="343.0" y="72" text-anchor="middle" fill="#5F5E5A" font-size="11">cycle 2</text>
<text x="405.0" y="72" text-anchor="middle" fill="#5F5E5A" font-size="11">cycle 3</text>
<text x="467.0" y="72" text-anchor="middle" fill="#5F5E5A" font-size="11">cycle 4</text>
<text x="529.0" y="72" text-anchor="middle" fill="#5F5E5A" font-size="11">cycle 5</text>
<text x="591.0" y="72" text-anchor="middle" fill="#5F5E5A" font-size="11">cycle 6</text>
<text x="653.0" y="72" text-anchor="middle" fill="#5F5E5A" font-size="11">cycle 7</text>
<text x="715.0" y="72" text-anchor="middle" fill="#5F5E5A" font-size="11">cycle 8</text>
<text x="777.0" y="72" text-anchor="middle" fill="#5F5E5A" font-size="11">cycle 9</text>
<text x="20" y="102.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#2C2C2A">blt  s1, t0, loop</text>
<rect x="252" y="82" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="281.0" y="102.0" text-anchor="middle" fill="#2C2C2A" font-weight="600">IF</text>
<rect x="314" y="82" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="343.0" y="102.0" text-anchor="middle" fill="#2C2C2A" font-weight="600">ID</text>
<rect x="376" y="82" width="58" height="30" rx="4" fill="#FAEEDA" stroke="#EF9F27" stroke-width="2"/>
<text x="405.0" y="102.0" text-anchor="middle" fill="#2C2C2A" font-weight="600">EX</text>
<rect x="438" y="82" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="467.0" y="102.0" text-anchor="middle" fill="#2C2C2A" font-weight="600">ME</text>
<rect x="500" y="82" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="529.0" y="102.0" text-anchor="middle" fill="#2C2C2A" font-weight="600">W</text>
<text x="20" y="138.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#2C2C2A">(cycle 2에 fetch할 명령어)</text>
<rect x="314" y="118" width="58" height="30" rx="4" fill="#F3D9D9" stroke="#C0392B" stroke-dasharray="4 3"/>
<text x="343.0" y="138.0" text-anchor="middle" fill="#C0392B" font-size="11">bubble</text>
<text x="20" y="174.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#2C2C2A">(cycle 3에 fetch할 명령어)</text>
<rect x="376" y="154" width="58" height="30" rx="4" fill="#F3D9D9" stroke="#C0392B" stroke-dasharray="4 3"/>
<text x="405.0" y="174.0" text-anchor="middle" fill="#C0392B" font-size="11">bubble</text>
<text x="20" y="210.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#2C2C2A">slli s2, s1, 2  ← loop</text>
<rect x="438" y="190" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="467.0" y="210.0" text-anchor="middle" fill="#2C2C2A" font-weight="600">IF</text>
<rect x="500" y="190" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="529.0" y="210.0" text-anchor="middle" fill="#2C2C2A" font-weight="600">ID</text>
<rect x="562" y="190" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="591.0" y="210.0" text-anchor="middle" fill="#2C2C2A" font-weight="600">EX</text>
<rect x="624" y="190" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="653.0" y="210.0" text-anchor="middle" fill="#2C2C2A" font-weight="600">ME</text>
<rect x="686" y="190" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="715.0" y="210.0" text-anchor="middle" fill="#2C2C2A" font-weight="600">W</text>
<path d="M 405 112 V 136 H 467 V 189" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#ah)"/>
<text x="537.0" y="155.0" fill="#C0392B" font-size="11">EX에서 taken + target 확정 → 이때 loop를 fetch</text>
<text x="343.0" y="206" text-anchor="middle" fill="#C0392B" font-size="11">IF 슬롯 2개가 빈다</text>
<text x="20" y="262" fill="#5F5E5A" font-size="12">Branch prediction + BTB: cycle 1에 fetch한 주소로 BTB를 찾아 "taken, target = loop"를 예측하고</text>
<text x="20" y="280" fill="#5F5E5A" font-size="12">cycle 2에 slli를 바로 fetch한다. 틀리면 cycle 3 이후 되돌린다.</text>
</svg>