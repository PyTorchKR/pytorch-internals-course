<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" role="img">
  <title>Latency Hiding: 작업을 하나씩 처리할 때와 겹쳐 처리할 때의 Throughput</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- one task at a time -->
  <rect x="40" y="20" width="140" height="34" rx="4" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
  <rect x="190" y="20" width="140" height="34" rx="4" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
  <rect x="340" y="20" width="140" height="34" rx="4" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
  <line x1="30" y1="72" x2="515" y2="72" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="522" y="76" font-size="13" fill="#B4B2A9">time</text>
  <text x="590" y="42" font-size="14" fill="#B4B2A9">Latency가 Throughput 결정</text>

  <!-- overlapped tasks -->
  <rect x="10" y="104" width="860" height="176" rx="12" fill="none" stroke="#FAC775" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="130" y="122" width="140" height="34" rx="4" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
  <rect x="220" y="164" width="140" height="34" rx="4" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
  <rect x="310" y="206" width="140" height="34" rx="4" fill="#444441" stroke="#B4B2A9" stroke-width="0.5"/>
  <line x1="30" y1="260" x2="515" y2="260" stroke="#B4B2A9" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="522" y="264" font-size="13" fill="#B4B2A9">time</text>
  <text x="590" y="186" font-size="14" fill="#B4B2A9">시작 간격이 Throughput 결정</text>
</svg>
