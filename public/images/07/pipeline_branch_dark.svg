<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="-apple-system, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="13">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#E07A6A"/></marker></defs>
<text x="20" y="46" font-size="14" font-weight="600" fill="#D3D1C7">Branch latency: 분기 방향과 target 주소는 EX가 끝나야 정해진다</text>
<text x="281.0" y="72" text-anchor="middle" fill="#B4B2A9" font-size="11">cycle 1</text>
<text x="343.0" y="72" text-anchor="middle" fill="#B4B2A9" font-size="11">cycle 2</text>
<text x="405.0" y="72" text-anchor="middle" fill="#B4B2A9" font-size="11">cycle 3</text>
<text x="467.0" y="72" text-anchor="middle" fill="#B4B2A9" font-size="11">cycle 4</text>
<text x="529.0" y="72" text-anchor="middle" fill="#B4B2A9" font-size="11">cycle 5</text>
<text x="591.0" y="72" text-anchor="middle" fill="#B4B2A9" font-size="11">cycle 6</text>
<text x="653.0" y="72" text-anchor="middle" fill="#B4B2A9" font-size="11">cycle 7</text>
<text x="715.0" y="72" text-anchor="middle" fill="#B4B2A9" font-size="11">cycle 8</text>
<text x="777.0" y="72" text-anchor="middle" fill="#B4B2A9" font-size="11">cycle 9</text>
<text x="20" y="102.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#D3D1C7">blt  s1, t0, loop</text>
<rect x="252" y="82" width="58" height="30" rx="4" fill="#444441" stroke="#B4B2A9" stroke-width="1"/>
<text x="281.0" y="102.0" text-anchor="middle" fill="#D3D1C7" font-weight="600">IF</text>
<rect x="314" y="82" width="58" height="30" rx="4" fill="#444441" stroke="#B4B2A9" stroke-width="1"/>
<text x="343.0" y="102.0" text-anchor="middle" fill="#D3D1C7" font-weight="600">ID</text>
<rect x="376" y="82" width="58" height="30" rx="4" fill="#4A3A22" stroke="#FAC775" stroke-width="2"/>
<text x="405.0" y="102.0" text-anchor="middle" fill="#D3D1C7" font-weight="600">EX</text>
<rect x="438" y="82" width="58" height="30" rx="4" fill="#444441" stroke="#B4B2A9" stroke-width="1"/>
<text x="467.0" y="102.0" text-anchor="middle" fill="#D3D1C7" font-weight="600">MEM</text>
<rect x="500" y="82" width="58" height="30" rx="4" fill="#444441" stroke="#B4B2A9" stroke-width="1"/>
<text x="529.0" y="102.0" text-anchor="middle" fill="#D3D1C7" font-weight="600">WB</text>
<text x="20" y="138.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#D3D1C7">(cycle 2에 fetch할 명령어)</text>
<rect x="314" y="118" width="58" height="30" rx="4" fill="#4A2A2A" stroke="#E07A6A" stroke-dasharray="4 3"/>
<text x="343.0" y="138.0" text-anchor="middle" fill="#E07A6A" font-size="11">bubble</text>
<text x="20" y="174.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#D3D1C7">(cycle 3에 fetch할 명령어)</text>
<rect x="376" y="154" width="58" height="30" rx="4" fill="#4A2A2A" stroke="#E07A6A" stroke-dasharray="4 3"/>
<text x="405.0" y="174.0" text-anchor="middle" fill="#E07A6A" font-size="11">bubble</text>
<text x="20" y="210.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#D3D1C7">slli s2, s1, 2  ← loop</text>
<rect x="438" y="190" width="58" height="30" rx="4" fill="#444441" stroke="#B4B2A9" stroke-width="1"/>
<text x="467.0" y="210.0" text-anchor="middle" fill="#D3D1C7" font-weight="600">IF</text>
<rect x="500" y="190" width="58" height="30" rx="4" fill="#444441" stroke="#B4B2A9" stroke-width="1"/>
<text x="529.0" y="210.0" text-anchor="middle" fill="#D3D1C7" font-weight="600">ID</text>
<rect x="562" y="190" width="58" height="30" rx="4" fill="#444441" stroke="#B4B2A9" stroke-width="1"/>
<text x="591.0" y="210.0" text-anchor="middle" fill="#D3D1C7" font-weight="600">EX</text>
<rect x="624" y="190" width="58" height="30" rx="4" fill="#444441" stroke="#B4B2A9" stroke-width="1"/>
<text x="653.0" y="210.0" text-anchor="middle" fill="#D3D1C7" font-weight="600">MEM</text>
<rect x="686" y="190" width="58" height="30" rx="4" fill="#444441" stroke="#B4B2A9" stroke-width="1"/>
<text x="715.0" y="210.0" text-anchor="middle" fill="#D3D1C7" font-weight="600">WB</text>
<path d="M 405.0 112 C 445.0 142, 507.0 150, 467.0 190" fill="none" stroke="#E07A6A" stroke-width="2" marker-end="url(#ah)"/>
<text x="537.0" y="155.0" fill="#E07A6A" font-size="11">EX에서 taken + target 확정 → 그제서야 loop를 fetch</text>
<text x="343.0" y="206" text-anchor="middle" fill="#E07A6A" font-size="11">IF 슬롯 2개가 빈다</text>
<text x="20" y="248" fill="#B4B2A9" font-size="12">분기가 6~7 명령어에 하나꼴이면 이 손실은 무시할 수 없다.</text>
<text x="20" y="268" fill="#B4B2A9" font-size="12">Branch prediction + BTB: cycle 1에 fetch한 주소로 BTB를 찾아 "taken, target = loop"를 예측하고 cycle 2에 slli를 바로 fetch한다. 틀리면 cycle 3 이후 되돌린다.</text>
</svg>