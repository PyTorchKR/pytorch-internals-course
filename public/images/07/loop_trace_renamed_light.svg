<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="-apple-system, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="12">
<defs><marker id="m-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#C0392B"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#0F6E56"/></marker></defs>
<text x="84" y="21" font-size="11" font-weight="600" fill="#378ADD">iteration i</text>
<rect x="84" y="28" width="196" height="140" rx="4" fill="#DCEBFA" stroke="#378ADD" stroke-width="1"/>
<text x="94" y="41" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#2C2C2A" xml:space="preserve">slli  s2, s1, 2</text>
<text x="94" y="59" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#2C2C2A" xml:space="preserve">add   s3, s0, s2</text>
<text x="94" y="77" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#2C2C2A" xml:space="preserve">lw    t1, 0(s3)</text>
<text x="94" y="95" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#2C2C2A" xml:space="preserve">mul   t2, t1, t1</text>
<text x="94" y="113" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#2C2C2A" xml:space="preserve">add   t3, t2, t1</text>
<text x="94" y="131" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#2C2C2A" xml:space="preserve">sw    t3, 0(s3)</text>
<text x="94" y="149" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#2C2C2A" xml:space="preserve">addi  s1′, s1, 1</text>
<text x="84" y="195" font-size="11" font-weight="600" fill="#0F6E56">iteration i+1</text>
<rect x="84" y="202" width="196" height="140" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="94" y="215" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#2C2C2A" xml:space="preserve">slli  s2′, s1′, 2</text>
<text x="94" y="233" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#2C2C2A" xml:space="preserve">add   s3′, s0, s2′</text>
<text x="94" y="251" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#2C2C2A" xml:space="preserve">lw    t1′, 0(s3′)</text>
<text x="94" y="269" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#2C2C2A" xml:space="preserve">mul   t2′, t1′, t1′</text>
<text x="94" y="287" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#2C2C2A" xml:space="preserve">add   t3′, t2′, t1′</text>
<text x="94" y="305" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#2C2C2A" xml:space="preserve">sw    t3′, 0(s3′)</text>
<text x="94" y="323" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#2C2C2A" xml:space="preserve">addi  s1″, s1′, 1</text>
<path d="M 280 145 C 314 145, 314 211, 280 211" fill="none" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#m-ok)"/>
<text x="310.5" y="182.0" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#0F6E56">s1′</text>
<text x="84" y="366" font-size="11" fill="#5F5E5A">새 이름(′)을 받은 값은 저장 공간이 겹치지 않아 False Dependency 없음</text>
<text x="84" y="381" font-size="11" fill="#0F6E56">남는 의존은 s1′ 하나</text>
</svg>
