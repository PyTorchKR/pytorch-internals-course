<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" font-family="-apple-system, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="13">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#C0392B"/></marker></defs>
<text x="20" y="46" font-size="14" font-weight="600" fill="#2C2C2A">Data hazard와 forwarding: add가 만든 t3를 바로 다음 sw가 읽는다</text>
<text x="281.0" y="72" text-anchor="middle" fill="#5F5E5A" font-size="11">cycle 1</text>
<text x="343.0" y="72" text-anchor="middle" fill="#5F5E5A" font-size="11">cycle 2</text>
<text x="405.0" y="72" text-anchor="middle" fill="#5F5E5A" font-size="11">cycle 3</text>
<text x="467.0" y="72" text-anchor="middle" fill="#5F5E5A" font-size="11">cycle 4</text>
<text x="529.0" y="72" text-anchor="middle" fill="#5F5E5A" font-size="11">cycle 5</text>
<text x="591.0" y="72" text-anchor="middle" fill="#5F5E5A" font-size="11">cycle 6</text>
<text x="653.0" y="72" text-anchor="middle" fill="#5F5E5A" font-size="11">cycle 7</text>
<text x="715.0" y="72" text-anchor="middle" fill="#5F5E5A" font-size="11">cycle 8</text>
<text x="777.0" y="72" text-anchor="middle" fill="#5F5E5A" font-size="11">cycle 9</text>
<text x="20" y="102" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#2C2C2A">add  t3, t2, t1</text>
<rect x="252" y="82" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="281.0" y="102" text-anchor="middle" fill="#2C2C2A" font-weight="600">IF</text>
<rect x="314" y="82" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="343.0" y="102" text-anchor="middle" fill="#2C2C2A" font-weight="600">ID</text>
<rect x="376" y="82" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="405.0" y="102" text-anchor="middle" fill="#2C2C2A" font-weight="600">EX</text>
<rect x="438" y="82" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="467.0" y="102" text-anchor="middle" fill="#2C2C2A" font-weight="600">ME</text>
<rect x="500" y="82" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="529.0" y="102" text-anchor="middle" fill="#2C2C2A" font-weight="600">W</text>
<text x="20" y="158" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#2C2C2A">sw   t3, 0(s3)</text>
<rect x="314" y="138" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="343.0" y="158" text-anchor="middle" fill="#2C2C2A" font-weight="600">IF</text>
<rect x="376" y="138" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="405.0" y="158" text-anchor="middle" fill="#2C2C2A" font-weight="600">ID</text>
<rect x="438" y="138" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="467.0" y="158" text-anchor="middle" fill="#2C2C2A" font-weight="600">EX</text>
<rect x="500" y="138" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="529.0" y="158" text-anchor="middle" fill="#2C2C2A" font-weight="600">ME</text>
<rect x="562" y="138" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="591.0" y="158" text-anchor="middle" fill="#2C2C2A" font-weight="600">W</text>
<path d="M 405 112 V 125 H 467 V 137" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#ah)"/>
<text x="479.0" y="129.0" fill="#C0392B" font-size="11">forwarding</text>
<text x="20" y="192" fill="#5F5E5A" font-size="12">add의 EX 결과(cycle 3)가 레지스터에 써지는 W(cycle 5)를 기다리지 않고, sw의 EX(cycle 4)로 곧장 forwarding된다. bubble 없음.</text>
<text x="20" y="236" font-size="14" font-weight="600" fill="#2C2C2A">Load-use hazard: lw가 읽어 온 t1을 바로 다음 mul이 쓴다</text>
<text x="281.0" y="262" text-anchor="middle" fill="#5F5E5A" font-size="11">cycle 1</text>
<text x="343.0" y="262" text-anchor="middle" fill="#5F5E5A" font-size="11">cycle 2</text>
<text x="405.0" y="262" text-anchor="middle" fill="#5F5E5A" font-size="11">cycle 3</text>
<text x="467.0" y="262" text-anchor="middle" fill="#5F5E5A" font-size="11">cycle 4</text>
<text x="529.0" y="262" text-anchor="middle" fill="#5F5E5A" font-size="11">cycle 5</text>
<text x="591.0" y="262" text-anchor="middle" fill="#5F5E5A" font-size="11">cycle 6</text>
<text x="653.0" y="262" text-anchor="middle" fill="#5F5E5A" font-size="11">cycle 7</text>
<text x="715.0" y="262" text-anchor="middle" fill="#5F5E5A" font-size="11">cycle 8</text>
<text x="777.0" y="262" text-anchor="middle" fill="#5F5E5A" font-size="11">cycle 9</text>
<text x="20" y="292" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#2C2C2A">lw   t1, 0(s3)</text>
<rect x="252" y="272" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="281.0" y="292" text-anchor="middle" fill="#2C2C2A" font-weight="600">IF</text>
<rect x="314" y="272" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="343.0" y="292" text-anchor="middle" fill="#2C2C2A" font-weight="600">ID</text>
<rect x="376" y="272" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="405.0" y="292" text-anchor="middle" fill="#2C2C2A" font-weight="600">EX</text>
<rect x="438" y="272" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="467.0" y="292" text-anchor="middle" fill="#2C2C2A" font-weight="600">ME</text>
<rect x="500" y="272" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="529.0" y="292" text-anchor="middle" fill="#2C2C2A" font-weight="600">W</text>
<text x="20" y="348" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#2C2C2A">mul  t2, t1, t1</text>
<rect x="314" y="328" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="343.0" y="348" text-anchor="middle" fill="#2C2C2A" font-weight="600">IF</text>
<rect x="376" y="328" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="405.0" y="348" text-anchor="middle" fill="#2C2C2A" font-weight="600">ID</text>
<rect x="438" y="328" width="58" height="30" rx="4" fill="#F3D9D9" stroke="#C0392B" stroke-dasharray="4 3"/>
<text x="467.0" y="348" text-anchor="middle" fill="#C0392B" font-size="11">bubble</text>
<rect x="500" y="328" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="529.0" y="348" text-anchor="middle" fill="#2C2C2A" font-weight="600">EX</text>
<rect x="562" y="328" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="591.0" y="348" text-anchor="middle" fill="#2C2C2A" font-weight="600">ME</text>
<rect x="624" y="328" width="58" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="653.0" y="348" text-anchor="middle" fill="#2C2C2A" font-weight="600">W</text>
<path d="M 467 302 V 315 H 529 V 327" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#ah)"/>
<text x="541.0" y="319.0" fill="#C0392B" font-size="11">forwarding</text>
<text x="20" y="382" fill="#5F5E5A" font-size="12">lw의 데이터는 ME(cycle 4)가 끝나야 나오므로 mul의 EX는 cycle 5로 밀린다. forwarding으로도 한 cycle stall은 피할 수 없다.</text>
</svg>
