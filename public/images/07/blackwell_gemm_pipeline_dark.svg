<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
  font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif">

  <!-- time axis -->
  <g stroke="#B4B2A9" stroke-width="1.2" fill="none">
    <line x1="200" y1="30" x2="820" y2="30"/>
  </g>
  <polygon points="820,25 832,30 820,35" fill="#B4B2A9"/>
  <text x="840" y="34" font-size="13" fill="#B4B2A9">time</text>

  <!-- row labels -->
  <g>
    <text x="20" y="82" font-size="14" fill="#D3D1C7">TMA</text>
    <text x="20" y="99" font-size="11" fill="#B4B2A9">GMEM → SMEM</text>

    <text x="20" y="144" font-size="14" fill="#D3D1C7">Tensor Core (tcgen05)</text>
    <text x="20" y="161" font-size="11" fill="#B4B2A9">SMEM → TMEM 누적</text>

    <text x="20" y="206" font-size="14" fill="#D3D1C7">Epilogue Warp-Group</text>
    <text x="20" y="223" font-size="11" fill="#B4B2A9">TMEM → GMEM</text>
  </g>

  <!-- TMA row: green tiles -->
  <g>
    <rect x="200" y="60" width="120" height="44" rx="4" fill="#233B34" stroke="#5DCAA5" stroke-width="1.5"/>
    <rect x="328" y="60" width="120" height="44" rx="4" fill="#233B34" stroke="#5DCAA5" stroke-width="1.5"/>
    <rect x="456" y="60" width="120" height="44" rx="4" fill="#233B34" stroke="#5DCAA5" stroke-width="1.5"/>
    <rect x="584" y="60" width="120" height="44" rx="4" fill="#233B34" stroke="#5DCAA5" stroke-width="1.5"/>
    <rect x="712" y="60" width="120" height="44" rx="4" fill="#233B34" stroke="#5DCAA5" stroke-width="1.5"/>
    <g font-size="13" fill="#5DCAA5" text-anchor="middle">
      <text x="260" y="87">tile k−1</text>
      <text x="388" y="87">tile k</text>
      <text x="516" y="87">tile k+1</text>
      <text x="644" y="87">tile k+2</text>
      <text x="772" y="87">tile k+3</text>
    </g>
  </g>

  <!-- Tensor Core row: blue tiles, shifted by one slot -->
  <g>
    <rect x="328" y="122" width="120" height="44" rx="4" fill="#2A3A4D" stroke="#85B7EB" stroke-width="1.5"/>
    <rect x="456" y="122" width="120" height="44" rx="4" fill="#2A3A4D" stroke="#85B7EB" stroke-width="1.5"/>
    <rect x="584" y="122" width="120" height="44" rx="4" fill="#2A3A4D" stroke="#85B7EB" stroke-width="1.5"/>
    <rect x="712" y="122" width="120" height="44" rx="4" fill="#2A3A4D" stroke="#85B7EB" stroke-width="1.5"/>
    <g font-size="13" fill="#85B7EB" text-anchor="middle">
      <text x="388" y="149">tile k−1</text>
      <text x="516" y="149">tile k</text>
      <text x="644" y="149">tile k+1</text>
      <text x="772" y="149">tile k+2</text>
    </g>
  </g>

  <!-- Epilogue row: orange tiles, shifted by two slots -->
  <g>
    <rect x="456" y="184" width="120" height="44" rx="4" fill="#4A3A22" stroke="#FAC775" stroke-width="1.5"/>
    <rect x="584" y="184" width="120" height="44" rx="4" fill="#4A3A22" stroke="#FAC775" stroke-width="1.5"/>
    <rect x="712" y="184" width="120" height="44" rx="4" fill="#4A3A22" stroke="#FAC775" stroke-width="1.5"/>
    <g font-size="13" fill="#FAC775" text-anchor="middle">
      <text x="516" y="211">tile k−1</text>
      <text x="644" y="211">tile k</text>
      <text x="772" y="211">tile k+1</text>
    </g>
  </g>

  <!-- steady-state column highlight -->
  <rect x="450" y="52" width="132" height="184" rx="6" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="6 3"/>

  <!-- caption -->
  <text x="440" y="266" text-anchor="middle" font-size="13" fill="#B4B2A9">세로로 같은 위치 = 같은 시각</text>
  <text x="440" y="286" text-anchor="middle" font-size="12" fill="#B4B2A9">단계 사이의 완료 통지는 mbarrier가 전달</text>
</svg>
