<text x="20" y="442" fill="#5F5E5A" font-size="12">renaming 후: 같은 이름 s2, s3, t1…이 iteration마다 다른 물리 레지스터(p1…p12)에 매핑되어 false dependency가 사라진다.</text>
<text x="20" y="462" fill="#5F5E5A" font-size="12">두 열 사이 edge는 addi → slli 하나뿐. 나머지 명령어는 두 iteration에서 동시에 실행 가능</text>
