<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 376" width="680" height="376" role="img" aria-labelledby="aoi-light-title aoi-light-desc">
  <title id="aoi-light-title">Training mode에서 AOTAutograd의 개입</title>
  <desc id="aoi-light-desc">Dynamo가 만든 FX Graph는 backend compiler로 곧바로 전달되지 않고, AOTAutograd가 중간에 개입하여 joint graph를 만들고 forward와 backward로 분리한 뒤에야 backend compiler를 거쳐 torch.autograd.Function이 만들어진다.</desc>
  <defs>
    <marker id="aoi-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="aoi-arr-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#EF9F27" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="376" fill="#FFFFFF"/>

  <!-- ══ Arrows ══ -->
  <!-- nn.Module → Dynamo -->
  <path d="M148 72 H192" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#aoi-arr)"/>

  <!-- Direct path: Dynamo → backend compiler (dashed, custom backend only) -->
  <path d="M308 72 H464" fill="none" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#aoi-arr)"/>
  <rect x="268" y="88" width="240" height="30" rx="2" fill="#FFFFFF"/>
  <text x="388" y="98" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="8.5" fill="#5F5E5A" text-anchor="middle">기본 경로는 AOTAutograd를 거침</text>
  <text x="388" y="112" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="8.5" fill="#5F5E5A" text-anchor="middle">(custom backend는 FX graph를 직접 받을 수 있음)</text>

  <!-- Real path: Dynamo ↓ → AOTAutograd -->
  <path d="M252 96 V192 H268" fill="none" stroke="#EF9F27" stroke-width="1.4" marker-end="url(#aoi-arr-warm)"/>
  <rect x="168" y="132" width="72" height="14" rx="2" fill="#FFFFFF"/>
  <text x="236" y="142" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="8.5" fill="#854F0B" text-anchor="end">FX graph</text>

  <!-- AOTAutograd → backend compiler -->
  <path d="M504 192 H556 V100" fill="none" stroke="#EF9F27" stroke-width="1.4" marker-end="url(#aoi-arr-warm)"/>
  <rect x="452" y="132" width="96" height="14" rx="2" fill="#FFFFFF"/>
  <text x="544" y="142" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="8.5" fill="#854F0B" text-anchor="end">FWD/BWD 그래프</text>

  <!-- backend compiler → torch.autograd.Function -->
  <path d="M588 96 V264" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#aoi-arr)"/>

  <!-- ══ Node boxes ══ -->
  <!-- nn.Module -->
  <rect x="36" y="48" width="112" height="48" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="92" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="middle">nn.Module</text>

  <!-- Dynamo -->
  <rect x="196" y="48" width="112" height="48" rx="8" fill="#DCEBFA" stroke="#378ADD" stroke-width="1"/>
  <text x="252" y="74" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="middle">Dynamo</text>

  <!-- backend compiler -->
  <rect x="468" y="48" width="176" height="48" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="556" y="66" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="middle">backend compiler</text>
  <text x="556" y="82" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9" fill="#5F5E5A" text-anchor="middle" dominant-baseline="middle">예: Inductor</text>

  <!-- AOTAutograd (focal) -->
  <rect x="272" y="156" width="232" height="80" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1.4"/>
  <text x="388" y="178" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="middle">AOTAutograd</text>
  <text x="388" y="200" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9" fill="#854F0B" text-anchor="middle" dominant-baseline="middle">functionalization + decomposition</text>
  <text x="388" y="216" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9" fill="#854F0B" text-anchor="middle" dominant-baseline="middle">training: joint graph → fw/bw 분리</text>

  <!-- torch.autograd.Function -->
  <rect x="436" y="268" width="208" height="64" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="540" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="middle">torch.autograd.Function</text>
  <text x="540" y="310" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9" fill="#5F5E5A" text-anchor="middle" dominant-baseline="middle">compiled forward + backward</text>
</svg>
