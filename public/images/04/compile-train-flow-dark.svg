<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 484" width="700" height="484" role="img" aria-labelledby="ctf-dark-title ctf-dark-desc">
  <title id="ctf-dark-title">torch.compile 학습 시 forward/backward 흐름</title>
  <desc id="ctf-dark-desc">사용자 코드 세 줄이 실행될 때 내부 동작: 첫 호출에서 Dynamo와 AOTAutograd가 compiled forward와 backward를 가진 torch.autograd.Function을 생성하고, forward 실행 결과에 backward가 grad_fn으로 등록되었다가 loss.backward() 시점에 실행되어 gradient를 계산한다.</desc>
  <defs>
    <marker id="ctfd-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8F8880" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ctfd-arr-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#C89A6E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="484" fill="#141210"/>

  <!-- ══ Zone: torch.autograd.Function (painted first) ══ -->
  <rect x="376" y="120" width="288" height="224" rx="10" fill="#1A1815" stroke="#B8AFA4" stroke-width="1.2"/>
  <text x="400" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="500" fill="#B8AFA4">torch.autograd.Function</text>
  <text x="400" y="160" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#8F8880">forward + backward를 가진 하나의 custom Op</text>

  <!-- ══ Arrows (behind node boxes) ══ -->
  <!-- a. [1] → compile chip (첫 호출) -->
  <path d="M268 76 H340 V58 H394" fill="none" stroke="#8F8880" stroke-width="1.2" marker-end="url(#ctfd-arr)"/>
  <rect x="276" y="61" width="56" height="13" rx="2" fill="#141210"/>
  <text x="304" y="72" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#8F8880" text-anchor="middle">첫 호출</text>

  <!-- b. compile chip → Function 생성 (dashed) -->
  <path d="M532 80 V114" fill="none" stroke="#8F8880" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ctfd-arr)"/>
  <rect x="540" y="88" width="32" height="12" rx="2" fill="#141210"/>
  <text x="556" y="97" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#8F8880" text-anchor="middle">생성</text>

  <!-- c. [1] → compiled forward 실행 -->
  <path d="M268 96 H340 V202 H396" fill="none" stroke="#8F8880" stroke-width="1.2" marker-end="url(#ctfd-arr)"/>
  <rect x="268" y="81" width="72" height="14" rx="2" fill="#141210"/>
  <text x="304" y="92" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#8F8880" text-anchor="middle">forward 실행</text>

  <!-- d2. forward → backward : grad_fn 등록 (dashed, inside zone) -->
  <path d="M520 228 V258" fill="none" stroke="#8F8880" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ctfd-arr)"/>
  <rect x="528" y="236" width="80" height="14" rx="2" fill="#1A1815"/>
  <text x="532" y="246" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#8F8880">grad_fn 등록</text>

  <!-- e. [2] → compiled backward : grad_fn 연결 (dashed) -->
  <path d="M268 280 H340 V296 H396" fill="none" stroke="#8F8880" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ctfd-arr)"/>
  <rect x="280" y="265" width="48" height="13" rx="2" fill="#141210"/>
  <text x="304" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#8F8880" text-anchor="middle">grad_fn</text>

  <!-- f. [3] → compiled backward 실행 (warm accent) -->
  <path d="M268 380 H340 V308 H396" fill="none" stroke="#C89A6E" stroke-width="1.4" marker-end="url(#ctfd-arr-warm)"/>
  <rect x="270" y="384" width="116" height="24" rx="2" fill="#141210"/>
  <text x="274" y="393" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#C89A6E" text-anchor="start">loss backward 먼저,</text>
  <text x="274" y="405" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#C89A6E" text-anchor="start">→ compiled backward</text>

  <!-- g. compiled backward → gradients -->
  <path d="M520 316 V398" fill="none" stroke="#8F8880" stroke-width="1.2" marker-end="url(#ctfd-arr)"/>

  <!-- ══ Node boxes ══ -->
  <!-- Code [1] -->
  <rect x="20" y="60" width="248" height="56" rx="8" fill="#1C1A17" stroke="#57514A" stroke-width="1"/>
  <rect x="32" y="52" width="24" height="16" rx="2" fill="#141210" stroke="#5D574F" stroke-width="0.8"/>
  <text x="44" y="63.5" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#8F8880" text-anchor="middle">[1]</text>
  <text x="144" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="500" fill="#EDE9E3" text-anchor="middle" dominant-baseline="middle">outputs = compiled_model(images)</text>

  <!-- Code [2] -->
  <rect x="20" y="232" width="248" height="56" rx="8" fill="#1C1A17" stroke="#57514A" stroke-width="1"/>
  <rect x="32" y="224" width="24" height="16" rx="2" fill="#141210" stroke="#5D574F" stroke-width="0.8"/>
  <text x="44" y="235.5" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#8F8880" text-anchor="middle">[2]</text>
  <text x="144" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="500" fill="#EDE9E3" text-anchor="middle" dominant-baseline="middle">loss = F.cross_entropy(outputs, labels)</text>

  <!-- Code [3] -->
  <rect x="20" y="356" width="248" height="56" rx="8" fill="#1C1A17" stroke="#57514A" stroke-width="1"/>
  <rect x="32" y="348" width="24" height="16" rx="2" fill="#141210" stroke="#5D574F" stroke-width="0.8"/>
  <text x="44" y="359.5" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#8F8880" text-anchor="middle">[3]</text>
  <text x="144" y="388" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="500" fill="#EDE9E3" text-anchor="middle" dominant-baseline="middle">loss.backward()</text>

  <!-- Compile chip -->
  <rect x="400" y="36" width="264" height="44" rx="8" fill="#141210" stroke="#6A6058" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="532" y="53" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#EDE9E3" text-anchor="middle" dominant-baseline="middle">Dynamo tracing → AOTAutograd</text>
  <text x="532" y="68" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#8F8880" text-anchor="middle" dominant-baseline="middle">첫 호출 시 1회 (bwd lowering은 지연)</text>

  <!-- compiled forward -->
  <rect x="400" y="176" width="240" height="52" rx="8" fill="#162238" stroke="#2C4468" stroke-width="1"/>
  <text x="416" y="196" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" letter-spacing="1.2" fill="#6A9FD8">FWD</text>
  <text x="520" y="200" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#EDE9E3" text-anchor="middle" dominant-baseline="middle">compiled forward</text>
  <text x="520" y="216" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#8F8880" text-anchor="middle" dominant-baseline="middle">→ outputs 반환</text>

  <!-- compiled backward -->
  <rect x="400" y="264" width="240" height="52" rx="8" fill="#2A2018" stroke="#4A3A2C" stroke-width="1"/>
  <text x="416" y="284" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" letter-spacing="1.2" fill="#C89A6E">BWD</text>
  <text x="520" y="290" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#EDE9E3" text-anchor="middle" dominant-baseline="middle">compiled backward</text>
  <text x="520" y="306" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#8F8880" text-anchor="middle" dominant-baseline="middle">lowering은 첫 backward() 호출 시</text>

  <!-- gradients -->
  <rect x="400" y="404" width="240" height="44" rx="8" fill="#1C1A17" stroke="#3A362F" stroke-width="1"/>
  <text x="520" y="421" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#EDE9E3" text-anchor="middle" dominant-baseline="middle">model weight gradients</text>
  <text x="520" y="437" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill="#8F8880" text-anchor="middle" dominant-baseline="middle">w.grad 저장 → optimizer가 사용</text>
</svg>
