<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 100" role="img" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13">
<title>dz/dz = 1에서 x.grad = 16까지의 backward 흐름</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#888780"/></marker></defs>
<rect x="760.0" y="30.0" width="120" height="40" rx="6" fill="#FBE3D6" stroke="#D85A30" stroke-width="1.4"/>
<text x="820" y="54.5" text-anchor="middle" fill="#2C2C2A">dz/dz = 1</text>
<rect x="470.0" y="30.0" width="230" height="40" rx="6" fill="#FBE3D6" stroke="#D85A30" stroke-width="1.4"/>
<text x="585" y="54.5" text-anchor="middle" fill="#2C2C2A">PowBackward0: 1 × 2y = 8</text>
<rect x="200.0" y="30.0" width="210" height="40" rx="6" fill="#FBE3D6" stroke="#D85A30" stroke-width="1.4"/>
<text x="305" y="54.5" text-anchor="middle" fill="#2C2C2A">MulBackward0: 8 × 2 = 16</text>
<rect x="20.0" y="30.0" width="120" height="40" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.4"/>
<text x="80" y="54.5" text-anchor="middle" fill="#2C2C2A">x.grad = 16</text>
<path d="M 760.0 50.0 H 700.0" fill="none" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 470.0 50.0 H 410.0" fill="none" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 200.0 50.0 H 140.0" fill="none" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
</svg>
