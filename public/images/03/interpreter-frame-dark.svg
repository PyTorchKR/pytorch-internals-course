<svg width="100%" viewBox="0 0 680 290" xmlns="http://www.w3.org/2000/svg" style="font-family: sans-serif; background: none;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- call stack box -->
  <rect x="140" y="36" width="250" height="242" rx="8" fill="none" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="6 3"/>
  <text x="152" y="52" font-size="12" font-weight="600" fill="#D3D1C7">call stack</text>
  <text x="230" y="52" font-size="10.5" fill="#B4B2A9">(thread마다 하나)</text>

  <rect x="150" y="72" width="230" height="50" rx="6" fill="#253649" stroke="#5B8FD1" stroke-width="1"/>
  <text x="162" y="92" font-size="12" font-weight="600" fill="#8FB8E8">frame 2 (지금 실행 중)</text>
  <text x="162" y="110" font-size="10.5" fill="#B4B2A9">code object · local 변수 · value stack</text>

  <rect x="150" y="144" width="230" height="50" rx="6" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="1"/>
  <text x="162" y="164" font-size="12" font-weight="600" fill="#D3D1C7">frame 1</text>
  <text x="162" y="182" font-size="10.5" fill="#B4B2A9">code object · local 변수 · value stack</text>

  <rect x="150" y="216" width="230" height="50" rx="6" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="1"/>
  <text x="162" y="236" font-size="12" font-weight="600" fill="#D3D1C7">frame 0</text>
  <text x="162" y="254" font-size="10.5" fill="#B4B2A9">code object · local 변수 · value stack</text>
  <line x1="265" y1="123" x2="265" y2="142" stroke="#B4B2A9" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="274" y="136" font-size="10" fill="#B4B2A9">호출한 frame</text>
  <line x1="265" y1="195" x2="265" y2="214" stroke="#B4B2A9" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="274" y="208" font-size="10" fill="#B4B2A9">호출한 frame</text>

  <!-- evaluation loop -->
  <rect x="480" y="72" width="192" height="64" rx="6" fill="#45311C" stroke="#C8823A" stroke-width="1"/>
  <text x="492" y="92" font-size="12" font-weight="600" fill="#E0A96A">evaluation loop</text>
  <text x="492" y="110" font-size="10.5" fill="#B4B2A9">_PyEval_EvalFrameDefault(frame)</text>
  <text x="492" y="126" font-size="10.5" fill="#B4B2A9">받은 frame의 bytecode를 하나씩 실행</text>
  <line x1="382" y1="97" x2="478" y2="97" stroke="#B4B2A9" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="430" y="90" text-anchor="middle" font-size="9.5" fill="#B4B2A9">frame을 인자로 전달</text>

  <!-- Dynamo hook -->
  <rect x="480" y="160" width="192" height="50" rx="6" fill="none" stroke="#5B8FD1" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="492" y="180" font-size="12" font-weight="600" fill="#8FB8E8">Dynamo (PEP 523)</text>
  <text x="492" y="198" font-size="10.5" fill="#B4B2A9">이 evaluation 함수를 자기 것으로 교체</text>
  <line x1="576" y1="158" x2="576" y2="138" stroke="#5B8FD1" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arr)"/>
</svg>
