<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="monospace" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-scope" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3a7bd5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- outer scope: DeviceGuard(device 2) -->
  <rect x="100" y="40" width="400" height="150" rx="6" fill="rgba(58,123,213,0.10)" stroke="#3a7bd5" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="108" y="58" fill="#3a7bd5" font-weight="600">{ DeviceGuard g1(device 2);</text>
  <text x="484" y="182" fill="#3a7bd5" font-weight="600">}</text>

  <!-- inner scope: DeviceGuard(device 3) -->
  <rect x="200" y="70" width="200" height="100" rx="6" fill="rgba(58,123,213,0.10)" stroke="#3a7bd5" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="208" y="88" fill="#3a7bd5" font-weight="600" font-size="11">{ DeviceGuard g2(device 3);</text>
  <text x="384" y="162" fill="#3a7bd5" font-weight="600">}</text>

  <!-- set / restore arrows -->
  <line x1="100" y1="190" x2="100" y2="226" stroke="#3a7bd5" stroke-width="1.5" marker-end="url(#arr-scope)"/>
  <text x="104" y="212" fill="#3a7bd5">set 2</text>
  <line x1="200" y1="170" x2="200" y2="226" stroke="#3a7bd5" stroke-width="1.5" marker-end="url(#arr-scope)"/>
  <text x="204" y="212" fill="#3a7bd5">set 3</text>
  <line x1="400" y1="170" x2="400" y2="226" stroke="#3a7bd5" stroke-width="1.5" marker-end="url(#arr-scope)"/>
  <text x="404" y="212" fill="#3a7bd5">restore 2</text>
  <line x1="500" y1="190" x2="500" y2="226" stroke="#3a7bd5" stroke-width="1.5" marker-end="url(#arr-scope)"/>
  <text x="504" y="212" fill="#3a7bd5">restore 1</text>

  <!-- current device timeline -->
  <text x="20" y="224" fill="#222" font-size="11">current device</text>
  <rect x="20"  y="230" width="80"  height="34" fill="#f0f0f0" stroke="#999"/>
  <rect x="100" y="230" width="100" height="34" fill="#f0f0f0" stroke="#999"/>
  <rect x="200" y="230" width="200" height="34" fill="#f0f0f0" stroke="#999"/>
  <rect x="400" y="230" width="100" height="34" fill="#f0f0f0" stroke="#999"/>
  <rect x="500" y="230" width="80"  height="34" fill="#f0f0f0" stroke="#999"/>
  <text x="60"  y="251" text-anchor="middle" fill="#222">device 1</text>
  <text x="150" y="251" text-anchor="middle" fill="#222">device 2</text>
  <text x="300" y="251" text-anchor="middle" fill="#222">device 3</text>
  <text x="450" y="251" text-anchor="middle" fill="#222">device 2</text>
  <text x="540" y="251" text-anchor="middle" fill="#222">device 1</text>
  <line x1="20" y1="282" x2="588" y2="282" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="20" y="296" fill="#222" font-size="11">time</text>
</svg>
