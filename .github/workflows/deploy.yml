name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The github-pages environment only deploys from main, so a release
  # re-runs this workflow on main to pick up the new tag in the footer.
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  redeploy-on-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-run the deploy workflow on main
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
        with:
          # Full history and tags, so the footer can show `git describe` output.
          fetch-depth: 0
      - name: Install, build, and upload your site output
        uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247     # v6.1.3
        with:
          package-manager: bun@1.4.2

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
